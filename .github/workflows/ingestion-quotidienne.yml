# Ingestion et scoring quotidiens.
#
# Le moteur accumule sa valeur avec l'observation : les dérivées d'offres
# (republication, réactualisation, vélocité) et l'historique des scores
# (score_snapshot) n'existent que si quelqu'un regarde tous les jours.
# Ce workflow le fait, même sans utilisateur.
#
# Secrets à renseigner dans le dépôt : DATABASE_URL, FRANCETRAVAIL_CLIENT_ID,
# FRANCETRAVAIL_CLIENT_SECRET (et LBB_ENDPOINT si l'accès La Bonne Boîte est ouvert).
name: Ingestion quotidienne

on:
  schedule:
    # 04:30 UTC tous les jours — après la mise à jour nocturne de l'INSEE (0h-3h).
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRANCETRAVAIL_CLIENT_ID: ${{ secrets.FRANCETRAVAIL_CLIENT_ID }}
      FRANCETRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCETRAVAIL_CLIENT_SECRET }}
      INGEST_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations
        run: npm run db:migrate
      - name: Ingestion (sirene → offres → boamp → decp → bodacc → georisques → acco)
        run: npm run ingest:all
      - name: Scoring et snapshot du jour
        run: npm run score
